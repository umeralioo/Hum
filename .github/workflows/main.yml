name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Locate project
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 2 -name '*.zip' -not -path './.git/*' | head -n1 || true)"
          if [ -n "${ZIP:-}" ]; then
            echo "Found archive: $ZIP"
            mkdir -p project
            unzip -q "$ZIP" -d project
            DIR="$(dirname "$(find project -name gradlew | head -n1)")"
          else
            echo "No archive found; building straight from the repo."
            DIR="$(dirname "$(find . -maxdepth 2 -name gradlew | head -n1)")"
          fi
          echo "Building in: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          rm -f ./local.properties
          ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        continue-on-error: true
        run: |
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          rm -f ./local.properties
          ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AgonApp-debug
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: AgonApp-release
          path: "**/app/build/outputs/apk/release/*.apk"
          if-no-files-found: warn
